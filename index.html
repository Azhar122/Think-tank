<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ISO-IPC System — Lamasat Muscat LLC</title>
<style>
:root {
  --bg-primary: #0f172a;
  --bg-secondary: #1e293b;
  --bg-card: #1e293b;
  --bg-surface: #334155;
  --bg-hover: #2d3f55;
  --accent: #0ea5e9;
  --accent-dark: #0284c7;
  --success: #10b981;
  --warning: #f59e0b;
  --danger: #ef4444;
  --text-primary: #f1f5f9;
  --text-secondary: #94a3b8;
  --text-muted: #64748b;
  --border: #334155;
  --nav-height: 60px;
  --sidebar-width: 240px;
  --radius-sm: 4px;
  --radius-md: 8px;
  --radius-lg: 12px;
  --shadow: 0 4px 6px -1px rgba(0,0,0,0.4);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Segoe UI', system-ui, sans-serif;
  background: var(--bg-primary);
  color: var(--text-primary);
  display: grid;
  grid-template-rows: var(--nav-height) 1fr;
  grid-template-columns: var(--sidebar-width) 1fr;
  grid-template-areas: "nav nav" "sidebar main";
  height: 100vh;
  overflow: hidden;
}

/* ── NAV ── */
#top-nav {
  grid-area: nav;
  background: var(--bg-secondary);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  padding: 0 24px;
  gap: 16px;
  z-index: 10;
}
.nav-brand { display: flex; flex-direction: column; }
.nav-brand-name { font-size: 15px; font-weight: 700; color: var(--text-primary); letter-spacing: 0.3px; }
.nav-brand-sub { font-size: 11px; color: var(--accent); letter-spacing: 1px; text-transform: uppercase; }
.nav-divider { width: 1px; height: 32px; background: var(--border); }
.nav-breadcrumb { flex: 1; font-size: 13px; color: var(--text-secondary); }
.nav-breadcrumb span { color: var(--text-muted); margin: 0 6px; }
.role-switcher { display: flex; gap: 4px; background: var(--bg-primary); padding: 4px; border-radius: var(--radius-md); }
.role-pill {
  padding: 5px 14px;
  border: none;
  border-radius: var(--radius-sm);
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  background: transparent;
  color: var(--text-secondary);
  transition: all 0.15s ease;
  letter-spacing: 0.5px;
}
.role-pill.active { background: var(--accent); color: #fff; }
.role-pill:hover:not(.active) { background: var(--bg-surface); color: var(--text-primary); }

/* ── SIDEBAR ── */
#sidebar {
  grid-area: sidebar;
  background: var(--bg-secondary);
  border-right: 1px solid var(--border);
  overflow-y: auto;
  padding: 16px 0;
}
.sidebar-section-label {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: var(--text-muted);
  padding: 8px 20px 6px;
}
.sidebar-link {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 9px 20px;
  font-size: 13px;
  color: var(--text-secondary);
  cursor: pointer;
  transition: all 0.15s ease;
  border-left: 3px solid transparent;
  user-select: none;
}
.sidebar-link:hover { background: var(--bg-hover); color: var(--text-primary); }
.sidebar-link.active { background: rgba(14,165,233,0.08); color: var(--accent); border-left-color: var(--accent); }
.sidebar-link .icon { width: 16px; height: 16px; opacity: 0.7; }
.sidebar-project-link {
  padding: 7px 20px 7px 32px;
  font-size: 12px;
  color: var(--text-muted);
  cursor: pointer;
  transition: all 0.15s ease;
  border-left: 3px solid transparent;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.sidebar-project-link:hover { background: var(--bg-hover); color: var(--text-primary); }
.sidebar-project-link.active { color: var(--accent); border-left-color: var(--accent); }

/* ── MAIN ── */
#main-content {
  grid-area: main;
  overflow-y: auto;
  padding: 28px 32px;
}
.screen { display: none; }
.screen.active { display: block; }

/* ── PAGE HEADER ── */
.page-header { margin-bottom: 24px; }
.page-title { font-size: 22px; font-weight: 700; color: var(--text-primary); }
.page-subtitle { font-size: 13px; color: var(--text-secondary); margin-top: 4px; }

/* ── CARDS ── */
.card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 20px;
  box-shadow: var(--shadow);
}
.card--blocked { border-left: 4px solid var(--danger); }
.card--at-risk { border-left: 4px solid var(--warning); }
.card--on-track { border-left: 4px solid var(--success); }
.card--delayed { border-left: 4px solid var(--danger); }

/* ── DASHBOARD ── */
.dashboard-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
  gap: 20px;
  margin-bottom: 32px;
}
.project-card { cursor: pointer; transition: transform 0.15s ease, box-shadow 0.15s ease; }
.project-card:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(0,0,0,0.5); }
.project-card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 14px; }
.project-card-name { font-size: 15px; font-weight: 600; color: var(--text-primary); margin-bottom: 3px; }
.project-card-client { font-size: 12px; color: var(--text-secondary); }
.project-card-meta { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
.project-card-stats { display: flex; gap: 16px; padding-top: 14px; border-top: 1px solid var(--border); }
.stat { display: flex; flex-direction: column; }
.stat-value { font-size: 20px; font-weight: 700; color: var(--text-primary); }
.stat-label { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
.iso-bar-wrap { margin-top: 10px; }
.iso-bar-label { display: flex; justify-content: space-between; font-size: 11px; color: var(--text-secondary); margin-bottom: 5px; }
.iso-bar-track { height: 5px; background: var(--bg-surface); border-radius: 3px; overflow: hidden; }
.iso-bar-fill { height: 100%; border-radius: 3px; transition: width 0.4s ease; }

/* ── BADGES ── */
.badge {
  display: inline-flex;
  align-items: center;
  padding: 3px 9px;
  border-radius: 20px;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.3px;
  white-space: nowrap;
}
.badge--blocked { background: rgba(239,68,68,0.15); color: var(--danger); border: 1px solid rgba(239,68,68,0.3); }
.badge--at-risk { background: rgba(245,158,11,0.15); color: var(--warning); border: 1px solid rgba(245,158,11,0.3); }
.badge--on-track { background: rgba(16,185,129,0.15); color: var(--success); border: 1px solid rgba(16,185,129,0.3); }
.badge--delayed { background: rgba(239,68,68,0.12); color: #f87171; border: 1px solid rgba(239,68,68,0.25); }
.badge--pending { background: rgba(245,158,11,0.15); color: var(--warning); border: 1px solid rgba(245,158,11,0.3); }
.badge--approved { background: rgba(16,185,129,0.15); color: var(--success); border: 1px solid rgba(16,185,129,0.3); }
.badge--rejected { background: rgba(239,68,68,0.15); color: var(--danger); border: 1px solid rgba(239,68,68,0.3); }
.badge--minor { background: rgba(100,116,139,0.2); color: var(--text-secondary); border: 1px solid var(--border); }
.badge--major { background: rgba(245,158,11,0.15); color: var(--warning); border: 1px solid rgba(245,158,11,0.3); }
.badge--critical { background: rgba(239,68,68,0.15); color: var(--danger); border: 1px solid rgba(239,68,68,0.3); }
.badge--open { background: rgba(239,68,68,0.1); color: #f87171; border: 1px solid rgba(239,68,68,0.2); }
.badge--in-review { background: rgba(245,158,11,0.1); color: var(--warning); border: 1px solid rgba(245,158,11,0.2); }
.badge--closed { background: rgba(16,185,129,0.1); color: var(--success); border: 1px solid rgba(16,185,129,0.2); }

/* ── BUTTONS ── */
.btn {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  padding: 8px 18px;
  border: none;
  border-radius: var(--radius-md);
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.15s ease;
  letter-spacing: 0.2px;
}
.btn--primary { background: var(--accent); color: #fff; }
.btn--primary:hover { background: var(--accent-dark); }
.btn--success { background: var(--success); color: #fff; }
.btn--success:hover { background: #059669; }
.btn--danger { background: var(--danger); color: #fff; }
.btn--danger:hover { background: #dc2626; }
.btn--ghost { background: transparent; color: var(--text-secondary); border: 1px solid var(--border); }
.btn--ghost:hover { background: var(--bg-surface); color: var(--text-primary); }
.btn--sm { padding: 5px 12px; font-size: 12px; }
.btn:disabled { opacity: 0.4; cursor: not-allowed; pointer-events: none; }

/* ── PHASE TIMELINE ── */
.phase-timeline { display: flex; flex-direction: column; gap: 8px; margin-top: 24px; }
.phase-row {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  overflow: hidden;
  transition: border-color 0.2s ease;
}
.phase-row--active { border-color: var(--accent); }
.phase-row--completed { border-color: rgba(16,185,129,0.3); }
.phase-row-header {
  display: flex;
  align-items: center;
  padding: 14px 18px;
  gap: 12px;
  cursor: default;
}
.phase-row--active .phase-row-header { cursor: pointer; }
.phase-row-header:hover .phase-row--active { background: var(--bg-hover); }
.phase-indicator {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  flex-shrink: 0;
}
.phase-row--completed .phase-indicator { background: var(--success); }
.phase-row--active .phase-indicator { background: var(--accent); box-shadow: 0 0 0 3px rgba(14,165,233,0.2); }
.phase-row--locked .phase-indicator { background: var(--bg-surface); }
.phase-row-name { font-size: 14px; font-weight: 600; flex: 1; }
.phase-row--completed .phase-row-name { color: var(--text-secondary); }
.phase-row--locked .phase-row-name { color: var(--text-muted); }
.phase-row-right { display: flex; align-items: center; gap: 10px; }
.lock-icon { color: var(--text-muted); font-size: 13px; }
.phase-detail { max-height: 0; overflow: hidden; transition: max-height 0.35s cubic-bezier(0.4,0,0.2,1), opacity 0.25s ease; opacity: 0; }
.phase-detail--visible { max-height: 2000px; opacity: 1; }
.phase-detail-inner { padding: 0 18px 20px; border-top: 1px solid var(--border); }

/* checklist sections */
.checklist-section { margin-top: 18px; }
.checklist-title {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 1.2px;
  text-transform: uppercase;
  color: var(--text-muted);
  margin-bottom: 10px;
}
.checklist-item {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 8px 0;
  border-bottom: 1px solid rgba(51,65,85,0.5);
}
.checklist-item:last-child { border-bottom: none; }
.checklist-item input[type="checkbox"] {
  width: 16px;
  height: 16px;
  accent-color: var(--accent);
  cursor: pointer;
  flex-shrink: 0;
  margin-top: 1px;
}
.checklist-item-label { font-size: 13px; color: var(--text-secondary); flex: 1; }
.checklist-item--done .checklist-item-label { color: var(--text-muted); text-decoration: line-through; }
.checklist-item-ref { font-size: 11px; color: var(--text-muted); background: var(--bg-primary); padding: 2px 7px; border-radius: 3px; font-family: monospace; white-space: nowrap; }

/* gate section */
.gate-section { margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--border); }
.gate-missing-list { margin: 12px 0; background: rgba(239,68,68,0.06); border: 1px solid rgba(239,68,68,0.2); border-radius: var(--radius-md); padding: 12px 16px; }
.gate-missing-title { font-size: 12px; font-weight: 600; color: var(--danger); margin-bottom: 8px; }
.gate-missing-item { font-size: 12px; color: #fca5a5; padding: 3px 0; display: flex; gap: 8px; }
.gate-missing-item::before { content: "✗"; color: var(--danger); }
.gate-rejection { margin-top: 12px; background: rgba(239,68,68,0.06); border: 1px solid rgba(239,68,68,0.2); border-radius: var(--radius-md); padding: 12px 16px; }
.gate-rejection-label { font-size: 11px; font-weight: 600; color: var(--danger); margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.8px; }
.gate-rejection-comment { font-size: 13px; color: #fca5a5; }

/* ── MODAL ── */
#modal-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.7);
  backdrop-filter: blur(4px);
  z-index: 100;
  align-items: center;
  justify-content: center;
}
#modal-overlay.open { display: flex; }
#gate-panel {
  background: var(--bg-secondary);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  width: 100%;
  max-width: 680px;
  max-height: 85vh;
  overflow-y: auto;
  box-shadow: 0 20px 60px rgba(0,0,0,0.6);
}
.gate-panel-header {
  padding: 20px 24px 16px;
  border-bottom: 1px solid var(--border);
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
}
.gate-panel-title { font-size: 16px; font-weight: 700; }
.gate-panel-subtitle { font-size: 12px; color: var(--text-secondary); margin-top: 3px; }
.gate-panel-body { padding: 20px 24px; }
.gate-panel-section-title {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 1.2px;
  text-transform: uppercase;
  color: var(--text-muted);
  margin-bottom: 10px;
  margin-top: 18px;
}
.gate-panel-section-title:first-child { margin-top: 0; }
.gate-review-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 9px 12px;
  border-radius: var(--radius-sm);
  margin-bottom: 4px;
  background: var(--bg-primary);
}
.gate-review-item--ok { }
.gate-review-item--fail { background: rgba(239,68,68,0.06); border: 1px solid rgba(239,68,68,0.15); }
.gate-item-icon { font-size: 14px; width: 20px; text-align: center; flex-shrink: 0; }
.gate-item-text { flex: 1; font-size: 13px; color: var(--text-secondary); }
.gate-item-ref { font-size: 11px; color: var(--text-muted); font-family: monospace; }
.gate-panel-footer {
  padding: 16px 24px 20px;
  border-top: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.gate-comment-area {
  width: 100%;
  background: var(--bg-primary);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: 10px 14px;
  color: var(--text-primary);
  font-size: 13px;
  resize: vertical;
  min-height: 70px;
  font-family: inherit;
}
.gate-comment-area:focus { outline: none; border-color: var(--accent); }
.gate-panel-actions { display: flex; gap: 10px; justify-content: flex-end; }

/* close button */
.close-btn {
  background: none;
  border: none;
  color: var(--text-muted);
  font-size: 20px;
  cursor: pointer;
  line-height: 1;
  padding: 2px 6px;
  border-radius: 4px;
}
.close-btn:hover { color: var(--text-primary); background: var(--bg-surface); }

/* ── NCR LOG ── */
.ncr-form-card { margin-bottom: 28px; }
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.form-group { display: flex; flex-direction: column; gap: 6px; }
.form-group--full { grid-column: 1 / -1; }
.form-label { font-size: 12px; font-weight: 600; color: var(--text-secondary); letter-spacing: 0.3px; }
.form-input, .form-select, .form-textarea {
  background: var(--bg-primary);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: 9px 12px;
  color: var(--text-primary);
  font-size: 13px;
  font-family: inherit;
  transition: border-color 0.15s ease;
}
.form-input:focus, .form-select:focus, .form-textarea:focus { outline: none; border-color: var(--accent); }
.form-select option { background: var(--bg-secondary); }
.form-textarea { resize: vertical; min-height: 70px; }
.form-actions { margin-top: 16px; display: flex; justify-content: flex-end; }

.ncr-table { width: 100%; border-collapse: collapse; }
.ncr-table th {
  text-align: left;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 1px;
  text-transform: uppercase;
  color: var(--text-muted);
  padding: 10px 14px;
  border-bottom: 1px solid var(--border);
}
.ncr-table td { padding: 12px 14px; font-size: 13px; border-bottom: 1px solid rgba(51,65,85,0.4); vertical-align: top; }
.ncr-row--flagged td:first-child { border-left: 3px solid var(--danger); }
.ncr-row--flagged { background: rgba(239,68,68,0.04); }
.ncr-desc { color: var(--text-primary); font-size: 13px; }
.ncr-project { font-size: 11px; color: var(--text-muted); margin-top: 3px; }
.ncr-flag { font-size: 11px; color: var(--danger); font-weight: 600; margin-top: 4px; }
.status-select {
  background: var(--bg-primary);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 4px 8px;
  color: var(--text-primary);
  font-size: 12px;
  cursor: pointer;
}

/* ── KPI PANEL ── */
.kpi-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 32px; }
.kpi-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 22px 20px;
  text-align: center;
}
.kpi-value { font-size: 36px; font-weight: 800; margin-bottom: 6px; }
.kpi-label { font-size: 12px; color: var(--text-secondary); line-height: 1.4; }
.kpi-trend { font-size: 11px; margin-top: 8px; font-weight: 600; }
.kpi-card--good .kpi-value { color: var(--success); }
.kpi-card--warn .kpi-value { color: var(--warning); }
.kpi-card--danger .kpi-value { color: var(--danger); }
.kpi-card--info .kpi-value { color: var(--accent); }
.kpi-section-title { font-size: 14px; font-weight: 700; color: var(--text-secondary); margin: 24px 0 14px; }
.project-kpi-table { width: 100%; border-collapse: collapse; }
.project-kpi-table th {
  text-align: left;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 1px;
  text-transform: uppercase;
  color: var(--text-muted);
  padding: 9px 14px;
  border-bottom: 1px solid var(--border);
}
.project-kpi-table td { padding: 12px 14px; font-size: 13px; border-bottom: 1px solid rgba(51,65,85,0.4); }

/* ── PHASE UNLOCK ANIMATION ── */
@keyframes phaseUnlock {
  0%  { background: var(--bg-card); }
  35% { background: rgba(14,165,233,0.18); border-color: var(--accent); }
  100%{ background: var(--bg-card); }
}
.phase-row--unlocking { animation: phaseUnlock 0.8s ease forwards; }

/* ── ROLE VISIBILITY ── */
.pm-only, .qhse-only, .ceo-only { display: none !important; }
[data-role="PM"]   .pm-only   { display: inline-flex !important; }
[data-role="QHSE"] .qhse-only { display: inline-flex !important; }
[data-role="CEO"]  .ceo-only  { display: inline-flex !important; }
[data-role="PM"]   .pm-block   { display: block !important; }
[data-role="QHSE"] .qhse-block { display: block !important; }

/* misc */
.divider { height: 1px; background: var(--border); margin: 20px 0; }
.empty-state { text-align: center; padding: 48px 24px; color: var(--text-muted); font-size: 13px; }
.mt-8 { margin-top: 8px; }
.mt-16 { margin-top: 16px; }
</style>
</head>
<body data-role="PM">

<!-- TOP NAV -->
<nav id="top-nav">
  <div class="nav-brand">
    <span class="nav-brand-name">Lamasat Muscat LLC</span>
    <span class="nav-brand-sub">ISO-IPC System</span>
  </div>
  <div class="nav-divider"></div>
  <div class="nav-breadcrumb" id="nav-breadcrumb">Dashboard</div>
  <div class="role-switcher">
    <button class="role-pill active" data-role="PM" onclick="handleRoleSwitch('PM')">PM</button>
    <button class="role-pill" data-role="QHSE" onclick="handleRoleSwitch('QHSE')">QHSE</button>
    <button class="role-pill" data-role="CEO" onclick="handleRoleSwitch('CEO')">CEO</button>
  </div>
</nav>

<!-- SIDEBAR -->
<aside id="sidebar">
  <div class="sidebar-section-label">Navigation</div>
  <div class="sidebar-link active" id="nav-dashboard" onclick="handleNavClick('dashboard',null)">
    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
    Dashboard
  </div>
  <div class="sidebar-link" id="nav-ncr" onclick="handleNavClick('ncr',null)">
    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="1"/><path d="M9 12l2 2 4-4"/></svg>
    NCR Log

function buildPhase(phaseName, status, isoOverrides, taskOverrides, docOverrides) {
  const isoTemplates = ISO_CHECKLISTS[phaseName];
  const taskTpls = TASK_TEMPLATES[phaseName];
  const docTpls = DOC_TEMPLATES[phaseName];

  const iso = isoTemplates.map(t => ({
    ...t,
    done: isoOverrides && isoOverrides[t.id] !== undefined ? isoOverrides[t.id] : (status === 'completed')
  }));
  const tasks = taskTpls.map(t => ({
    ...t,
    done: taskOverrides && taskOverrides[t.id] !== undefined ? taskOverrides[t.id] : (status === 'completed')
  }));
  const docs = docTpls.map(t => ({
    ...t,
    uploaded: docOverrides && docOverrides[t.id] !== undefined ? docOverrides[t.id] : (status === 'completed')
  }));

  return {
    name: phaseName,
    status: status,
    gateStatus: status === 'completed' ? 'approved' : 'none',
    gateRejectionComment: '',
    tasks,
    documents: docs,
    isoChecklist: iso,
  };
}

function isNcrAutoFlagged(ncr) {
  if (ncr.status !== 'open') return false;
  const days = (new Date('2026-05-08') - new Date(ncr.raisedDate)) / 86400000;
  return days > 7;
}

function runGateCheck(projectId, phaseIndex) {
  const project = state.projects.find(p => p.id === projectId);
  const phase = project.phases[phaseIndex];
  const missing = [];

  phase.tasks.forEach(t => {
    if (!t.done) missing.push({ type: 'task', label: t.label });
  });
  phase.documents.forEach(d => {
    if (!d.uploaded) missing.push({ type: 'document', label: d.label });
  });
  phase.isoChecklist.forEach(i => {
    if (!i.done) missing.push({ type: 'iso', ref: i.ref, label: i.label });
  });
  if (phase.name === 'Commissioning') {
    const openNcrs = state.ncrs.filter(n => n.projectId === projectId && n.status !== 'closed');
    if (openNcrs.length > 0) {
      missing.push({ type: 'ncr', label: `${openNcrs.length} open NCR(s) must be closed before Commissioning gate` });
    }
  }
  return { pass: missing.length === 0, missing };
}

function computeKPIs() {
  const allPhases = state.projects.flatMap(p => p.phases);
  const completedPhases = allPhases.filter(ph => ph.status === 'completed');
  // ISO completion: all active + completed phases
  const relevantPhases = allPhases.filter(ph => ph.status !== 'locked');
  let isoTotal = 0, isoDone = 0;
  relevantPhases.forEach(ph => {
    ph.isoChecklist.forEach(i => { isoTotal++; if (i.done) isoDone++; });
  });
  const isoCompletionPct = isoTotal > 0 ? Math.round((isoDone / isoTotal) * 100) : 0;
  const openNcrCount = state.ncrs.filter(n => n.status !== 'closed').length;
  return {
    onTimeRate: 83,
    openNcrCount,
    isoCompletionPct,
    daysSinceHseIncident: 47,
  };
}

function getIsoScore(project) {
  const relevantPhases = project.phases.filter(ph => ph.status !== 'locked');
  let total = 0, done = 0;
  relevantPhases.forEach(ph => {
    ph.isoChecklist.forEach(i => { total++; if (i.done) done++; });
  });
  return total > 0 ? Math.round((done / total) * 100) : 100;
}

function getOpenNcrCount(projectId) {
  return state.ncrs.filter(n => n.projectId === projectId && n.status !== 'closed').length;
}

function isProjectBlocked(project) {
  const active = project.phases[project.activePhaseIndex];
  if (!active) return false;
  const check = runGateCheck(project.id, project.activePhaseIndex);
  return !check.pass;
}

            </div>
            <div class="checklist-section">
              <div class="checklist-title">ISO Compliance Checklist</div>${isoRows}
            </div>
            <div class="gate-section">
              ${missingHtml}${rejectionHtml}
              <div style="margin-top:12px;">${signOffBtn}</div>
            </div>
          </div>
        </div>`;
    } else if (isCompleted) {
      const isoCount = phase.isoChecklist.length;
      detailHtml = `<div class="phase-detail" id="detail-phase-${idx}"></div>`;
    } else {
      detailHtml = `<div class="phase-detail" id="detail-phase-${idx}"></div>`;
    }

    const lockIcon = isLocked ? '<span class="lock-icon">🔒</span>' : '';
    const expandHint = isActive ? '<span style="font-size:11px;color:var(--text-muted);">▼ expanded</span>' : '';

    return `
    <div class="phase-row phase-row--${phase.status}" id="phase-row-${idx}">
      <div class="phase-row-header" ${isActive ? `onclick="togglePhaseDetail(${idx})"` : ''}>
        <div class="phase-indicator"></div>
        <span class="phase-row-name">${phase.name}</span>
        <div class="phase-row-right">
          ${gateBadge}${lockIcon}${expandHint}
          ${isCompleted ? '<span style="color:var(--success);font-size:18px;">✓</span>' : ''}
        </div>
      </div>
      ${detailHtml}
    </div>`;
  }).join('');

  container.innerHTML = `
    <div class="page-header" style="display:flex;justify-content:space-between;align-items:flex-start;">
      <div>
        <div style="font-size:12px;color:var(--text-muted);margin-bottom:4px;cursor:pointer;" onclick="handleNavClick('dashboard',null)">← Back to Dashboard</div>
        <div class="page-title">${project.name}</div>
        <div class="page-subtitle">${project.client} · ${project.value} ·
          <span class="badge badge--${project.scheduleStatus === 'on-track' ? 'on-track' : project.scheduleStatus === 'at-risk' ? 'at-risk' : 'delayed'}" style="font-size:11px;">
            ${project.scheduleStatus === 'on-track' ? '✓ On Track' : project.scheduleStatus === 'at-risk' ? '⚠ At Risk' : '✗ Delayed'}
          </span>
        </div>
      </div>
    </div>
    <div class="phase-timeline">${phasesHtml}</div>`;
}

function renderGatePanel() {
  const overlay = document.getElementById('modal-overlay');
  if (!state.gatePanel.open) { overlay.classList.remove('open'); return; }

  const { projectId, phaseIndex } = state.gatePanel;
  const project = state.projects.find(p => p.id === projectId);
  const phase = project.phases[phaseIndex];
  const check = runGateCheck(projectId, phaseIndex);

  const itemsHtml = (label, items, isDone) => items.map(item => {
    const ok = isDone(item);
    return `<div class="gate-review-item gate-review-item--${ok ? 'ok' : 'fail'}">
      <span class="gate-item-icon">${ok ? '✅' : '❌'}</span>
      <span class="gate-item-text">${item.label || item.name}</span>
      ${item.ref ? `<span class="gate-item-ref">${item.ref}</span>` : ''}
    </div>`;
  }).join('');

  const allItemsHtml = `
    <div class="gate-panel-section-title">Tasks</div>
    ${itemsHtml('Tasks', phase.tasks, t => t.done)}
    <div class="gate-panel-section-title">Required Documents</div>
    ${itemsHtml('Documents', phase.documents, d => d.uploaded)}
    <div class="gate-panel-section-title">ISO Compliance Checklist</div>
    ${itemsHtml('ISO', phase.isoChecklist, i => i.done)}`;

  const statusBadge = check.pass
    ? '<span class="badge badge--approved">All items complete — ready for approval</span>'
    : `<span class="badge badge--blocked">${check.missing.length} item(s) incomplete</span>`;

  document.getElementById('gate-panel').innerHTML = `
    <div class="gate-panel-header">
      <div>
        <div class="gate-panel-title">Gate Review — ${phase.name}</div>
        <div class="gate-panel-subtitle">${project.name} · ${statusBadge}</div>
      </div>
      <button class="close-btn" onclick="closeGatePanel()">✕</button>
    </div>
    <div class="gate-panel-body">${allItemsHtml}</div>
    <div class="gate-panel-footer qhse-block" style="display:none;">
      <textarea id="gate-comment" class="gate-comment-area" placeholder="Add a comment for the PM (required if rejecting)…"></textarea>
      <div class="gate-panel-actions">
        <button class="btn btn--ghost btn--sm" onclick="closeGatePanel()">Cancel</button>
        <button class="btn btn--danger btn--sm" onclick="handleGateReject()">Reject</button>
        <button class="btn btn--success btn--sm" onclick="handleGateApprove()">Approve Gate</button>
      </div>
    </div>
    <div class="gate-panel-footer pm-block" style="display:none;">
      <div style="font-size:13px;color:var(--text-secondary);">Awaiting QHSE officer review. Switch to QHSE role to approve.</div>
      <div class="gate-panel-actions"><button class="btn btn--ghost btn--sm" onclick="closeGatePanel()">Close</button></div>
    </div>`;

  overlay.classList.add('open');
}

function renderNcrLog() {
  const container = document.getElementById('screen-ncr');
  const projectOptions = state.projects.map(p => `<option value="${p.id}">${p.name}</option>`).join('');
  const phaseOptions = PHASE_NAMES.map(n => `<option value="${n}">${n}</option>`).join('');

  const ncrRows = state.ncrs.map(ncr => {
    const flagged = isNcrAutoFlagged(ncr);
    const daysOpen = ncr.status !== 'closed'
      ? Math.floor((new Date('2026-05-08') - new Date(ncr.raisedDate)) / 86400000)
      : null;
    return `
    <tr class="ncr-row${flagged ? ' ncr-row--flagged' : ''}">
      <td>
        <div class="ncr-desc">${ncr.description}</div>
        <div class="ncr-project">${ncr.projectName} · ${ncr.phase}</div>
        ${flagged ? `<div class="ncr-flag">⚠ Auto-flagged: ${daysOpen} days open (overdue)</div>` : ''}
      </td>
      <td><span class="badge badge--${ncr.severity}">${ncr.severity.charAt(0).toUpperCase() + ncr.severity.slice(1)}</span></td>
      <td style="color:var(--text-secondary);font-size:12px;">${ncr.assignedTo}</td>
      <td style="color:var(--text-secondary);font-size:12px;">${ncr.dueDate}</td>
      <td>
        <select class="status-select" data-ncr-id="${ncr.id}" onchange="handleNcrStatusChange('${ncr.id}',this.value)">
          <option value="open" ${ncr.status==='open'?'selected':''}>Open</option>
          <option value="in-review" ${ncr.status==='in-review'?'selected':''}>In Review</option>
          <option value="closed" ${ncr.status==='closed'?'selected':''}>Closed</option>
        </select>
      </td>
    </tr>`;
  }).join('');

  container.innerHTML = `
    <div class="page-header">
      <div class="page-title">NCR Log</div>
      <div class="page-subtitle">Non-Conformance Reports across all projects</div>
    </div>
    <div class="card ncr-form-card pm-block" style="display:none;">
      <div style="font-size:14px;font-weight:700;margin-bottom:16px;">Raise New NCR</div>
      <div class="form-grid">
        <div class="form-group">
          <label class="form-label">Project</label>
          <select id="ncr-project" class="form-select">${projectOptions}</select>
        </div>
        <div class="form-group">
          <label class="form-label">Phase</label>
          <select id="ncr-phase" class="form-select">${phaseOptions}</select>
        </div>
        <div class="form-group form-group--full">
          <label class="form-label">Description</label>
          <textarea id="ncr-desc" class="form-textarea" placeholder="Describe the non-conformance…"></textarea>
        </div>
        <div class="form-group">
          <label class="form-label">Severity</label>
          <select id="ncr-severity" class="form-select">
            <option value="minor">Minor</option>
            <option value="major">Major</option>
            <option value="critical">Critical</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Assigned To</label>
          <input id="ncr-assigned" type="text" class="form-input" placeholder="Name">
        </div>
        <div class="form-group">
          <label class="form-label">Due Date</label>
          <input id="ncr-due" type="date" class="form-input" value="2026-05-20">
        </div>
      </div>
      <div class="form-actions">
        <button class="btn btn--primary" onclick="handleAddNcr()">Raise NCR</button>
      </div>
    </div>
    <div class="card">
      <table class="ncr-table">
        <thead><tr>
          <th>Description</th><th>Severity</th><th>Assigned To</th><th>Due Date</th><th>Status</th>
        </tr></thead>
        <tbody>${ncrRows || '<tr><td colspan="5" class="empty-state">No NCRs raised yet.</td></tr>'}</tbody>
      </table>
    </div>`;
}

function renderKpiPanel() {
  const container = document.getElementById('screen-kpi');
  const kpis = computeKPIs();

  const projectRows = state.projects.map(p => {
    const isoScore = getIsoScore(p);
    const openNcrs = getOpenNcrCount(p.id);
    const phaseName = p.phases[p.activePhaseIndex]?.name || '—';
    return `<tr>
      <td style="font-weight:600;">${p.name}</td>
      <td><span class="badge badge--${p.scheduleStatus === 'on-track' ? 'on-track' : p.scheduleStatus === 'at-risk' ? 'at-risk' : 'delayed'}">${p.scheduleStatus}</span></td>
      <td>${phaseName}</td>
      <td>
        <div style="display:flex;align-items:center;gap:10px;">
          <div class="iso-bar-track" style="width:80px;"><div class="iso-bar-fill" style="width:${isoScore}%;background:${isoScore>=80?'var(--success)':isoScore>=60?'var(--warning)':'var(--danger)'};"></div></div>
          <span style="font-size:13px;font-weight:600;">${isoScore}%</span>
        </div>
      </td>
      <td style="color:${openNcrs>0?'var(--danger)':'var(--success)'}; font-weight:${openNcrs>0?'700':'400'};">${openNcrs}</td>
    </tr>`;
  }).join('');

  container.innerHTML = `
    <div class="page-header">
      <div class="page-title">KPI Panel</div>
      <div class="page-subtitle">Live performance metrics — recalculates on every state change</div>
    </div>
    <div class="kpi-grid">
      <div class="kpi-card kpi-card--good">
        <div class="kpi-value">${kpis.onTimeRate}%</div>
        <div class="kpi-label">On-Time Phase Completion Rate</div>
        <div class="kpi-trend" style="color:var(--success);">↑ +3% vs last quarter</div>
      </div>
      <div class="kpi-card kpi-card--${kpis.openNcrCount > 2 ? 'danger' : kpis.openNcrCount > 0 ? 'warn' : 'good'}">
        <div class="kpi-value">${kpis.openNcrCount}</div>
        <div class="kpi-label">Open Non-Conformance Reports</div>
        <div class="kpi-trend" style="color:${kpis.openNcrCount>0?'var(--warning)':'var(--success)'};">${kpis.openNcrCount > 0 ? '⚠ Action required' : '✓ All closed'}</div>
      </div>
      <div class="kpi-card kpi-card--${kpis.isoCompletionPct >= 80 ? 'good' : kpis.isoCompletionPct >= 60 ? 'warn' : 'danger'}">
        <div class="kpi-value">${kpis.isoCompletionPct}%</div>
        <div class="kpi-label">ISO Checklist Completion (active phases)</div>
        <div class="kpi-trend" style="color:var(--text-muted);">Across all 3 active projects</div>
      </div>
      <div class="kpi-card kpi-card--good">
        <div class="kpi-value">${kpis.daysSinceHseIncident}</div>
        <div class="kpi-label">Days Since Last HSE Incident</div>
        <div class="kpi-trend" style="color:var(--success);">✓ Excellent safety record</div>
      </div>
    </div>
    <div class="card">
      <div class="kpi-section-title">Per-Project Breakdown</div>
      <table class="project-kpi-table">
        <thead><tr><th>Project</th><th>Schedule</th><th>Active Phase</th><th>ISO Compliance</th><th>Open NCRs</th></tr></thead>
        <tbody>${projectRows}</tbody>
      </table>
    </div>`;
}

function render() {
  renderNav();
  renderSidebar();
  // Show correct screen
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  if (state.currentScreen === 'dashboard') {
    renderDashboard();
    document.getElementById('screen-dashboard').classList.add('active');
  } else if (state.currentScreen === 'project') {
    renderProjectView();
    document.getElementById('screen-project').classList.add('active');
  } else if (state.currentScreen === 'ncr') {
    renderNcrLog();
    document.getElementById('screen-ncr').classList.add('active');
  } else if (state.currentScreen === 'kpi') {
    renderKpiPanel();
    document.getElementById('screen-kpi').classList.add('active');
  }
  renderGatePanel();
}

// ════════════════════════════════════════
// EVENT HANDLERS
// ════════════════════════════════════════

function handleRoleSwitch(role) {
  state.currentRole = role;
  render();
}

function handleNavClick(screen, projectId) {
  state.currentScreen = screen;
  state.currentProjectId = projectId;
  state.gateCheckErrors = [];
  render();
}

function togglePhaseDetail(idx) {
  // Already rendered as visible for active phase; clicking header toggles
  const detail = document.getElementById(`detail-phase-${idx}`);
  if (detail) detail.classList.toggle('phase-detail--visible');
}

function handleCheckboxChange(event) {
  const el = event.target;
  if (el.type !== 'checkbox') return;
  const { projectId, phaseIndex, itemType, itemId } = el.dataset;
  if (!projectId) return;

  const project = state.projects.find(p => p.id === projectId);
  const phase = project.phases[parseInt(phaseIndex)];

  if (itemType === 'task') {
    const item = phase.tasks.find(t => t.id === itemId);
    if (item) item.done = el.checked;
  } else if (itemType === 'doc') {
    const item = phase.documents.find(d => d.id === itemId);
    if (item) item.uploaded = el.checked;
  } else if (itemType === 'iso') {
    const item = phase.isoChecklist.find(i => i.id === itemId);
    if (item) item.done = el.checked;
  }
  // Clear gate errors on any check
  state.gateCheckErrors = [];
  render();
}

function handleButtonClick(event) {
  const btn = event.target.closest('[data-action]');
  if (!btn) return;
  const action = btn.dataset.action;
  if (action === 'request-signoff') {
    const projectId = btn.dataset.projectId;
    const phaseIndex = parseInt(btn.dataset.phaseIndex);
    handleRequestSignOff(projectId, phaseIndex);
  }
}

function handleRequestSignOff(projectId, phaseIndex) {
  const result = runGateCheck(projectId, phaseIndex);
  if (!result.pass) {
    state.gateCheckErrors = result.missing;
    render();
    return;
  }
  state.gateCheckErrors = [];
  const project = state.projects.find(p => p.id === projectId);
  project.phases[phaseIndex].gateStatus = 'pending';
  state.gatePanel = { open: true, projectId, phaseIndex };
  render();
}

function closeGatePanel() {
  state.gatePanel = { open: false, projectId: null, phaseIndex: null };
  render();
}

function handleGateApprove() {
  const { projectId, phaseIndex } = state.gatePanel;
  const project = state.projects.find(p => p.id === projectId);
  const phase = project.phases[phaseIndex];

  phase.gateStatus = 'approved';
  phase.status = 'completed';

  const nextIdx = phaseIndex + 1;
  if (nextIdx < project.phases.length) {
    project.phases[nextIdx].status = 'active';
    project.activePhaseIndex = nextIdx;
  }

  state.gatePanel = { open: false, projectId: null, phaseIndex: null };
  state.gateCheckErrors = [];
  render();

  // Trigger unlock animation on the newly active phase
  setTimeout(() => {
    const row = document.getElementById(`phase-row-${nextIdx}`);
    if (row) {
      row.classList.add('phase-row--unlocking');
      setTimeout(() => row.classList.remove('phase-row--unlocking'), 900);
    }
  }, 120);
}

function handleGateReject() {
  const { projectId, phaseIndex } = state.gatePanel;
  const comment = document.getElementById('gate-comment')?.value?.trim() || '';
  const project = state.projects.find(p => p.id === projectId);
  const phase = project.phases[phaseIndex];

  phase.gateStatus = 'rejected';
  phase.gateRejectionComment = comment || 'No comment provided.';

  state.gatePanel = { open: false, projectId: null, phaseIndex: null };
  render();
}

function handleNcrStatusChange(ncrId, newStatus) {
  const ncr = state.ncrs.find(n => n.id === ncrId);
  if (ncr) ncr.status = newStatus;
  render();
}

function handleAddNcr() {
  const projectId = document.getElementById('ncr-project')?.value;
  const phase = document.getElementById('ncr-phase')?.value;
  const description = document.getElementById('ncr-desc')?.value?.trim();
  const severity = document.getElementById('ncr-severity')?.value;
  const assignedTo = document.getElementById('ncr-assigned')?.value?.trim();
  const dueDate = document.getElementById('ncr-due')?.value;

  if (!description || !assignedTo) {
    alert('Please fill in the Description and Assigned To fields.');
    return;
  }

  const project = state.projects.find(p => p.id === projectId);
  state.nextNcrId = (state.nextNcrId || 10) + 1;
  state.ncrs.push({
    id: `ncr-${state.nextNcrId}`,
    projectId,
    projectName: project?.name || projectId,
    phase,
    description,
    severity,
    assignedTo,
    dueDate,
    raisedDate: '2026-05-08',
    status: 'open',
  });
  render();
}

// Delegated listener
document.getElementById('main-content').addEventListener('change', handleCheckboxChange);
document.getElementById('main-content').addEventListener('click', handleButtonClick);

// Init
render();
</script>
</body>
</html>
